[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-delegation-firewall"
version = "1.0.0"
description = "Authorization & capability-narrowing system for multi-agent AI pipelines"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "PyJWT==2.10.1",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "redis==5.2.1",
    "PyYAML==6.0.2",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "fakeredis==2.26.2",
    "locust==2.32.5",
]

[tool.setuptools]
packages = [
    "checkpoint_service",
    "checkpoint_service.models",
    "checkpoint_service.engine",
    "checkpoint_service.routes",
    "checkpoint_service.db",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
# httpx logs every TestClient request at INFO, which buries the actual assertion
# output. Warnings and above still surface.
log_level = "WARNING"
